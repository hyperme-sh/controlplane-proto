name: Component checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    # Disposable hosted workers have no route into the shared private runner fleet.
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.26
          python-version: '3.13'
          enable-cache: false
      - run: bash scripts/check.sh
      # GitHub checks action allowlists even when this main-only upload is skipped.
      - name: Retain validated package bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-dist
          path: ${{ env.RELEASE_ARTIFACT_DIR }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
