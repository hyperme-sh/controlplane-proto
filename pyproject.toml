[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-proto"
version = "0.24.0"
requires-python = ">=3.13"
dependencies = ["protobuf>=6.33.6", "grpcio>=1.80.0"]

[tool.hatch.build.targets.wheel]
only-include = ["src/contractecho_pb2.py", "src/contractecho_pb2.pyi", "src/contractecho_pb2_grpc.py"]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"proto/spanopticon/v1/contractecho.proto" = "controlplane_proto_data/contractecho.proto"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
